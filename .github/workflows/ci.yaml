name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_call:

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: The built card must load as a module
        # A bundle that cannot be parsed is what a user would download.
        run: node --input-type=module -e "import('./dist/scribe-card.js').catch(e => { if (!/customElements|document|window/.test(String(e))) { throw e } })"

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: plugin
