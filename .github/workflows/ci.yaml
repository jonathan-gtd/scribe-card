name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_call:

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: The committed bundle must match the sources
        # dist/ is committed so HACS can install the card from the branch, not
        # only from a release. A stale one would ship code nobody reviewed.
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ is out of date: run npm run build and commit it."
            exit 1
          fi

      - name: Install a browser
        run: npx playwright install --with-deps chromium

      - name: The card must render, silently
        # Renders the built bundle in a real browser with sample rows — the
        # screenshot in the README — and fails on any console or page error.
        # A card that throws on load is what a user would have downloaded.
        run: npm run screenshot

      - name: The card must behave, in a real browser
        # What a screenshot cannot show: a failed refresh that keeps the chart,
        # a card moved across a dashboard, a theme switched, a hidden tab.
        run: npm run smoke

  e2e:
    name: In a real Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: scribe-card

      # The card is tested against the integration it talks to, so both are
      # needed. Scribe is copied into the throwaway instance's config.
      - uses: actions/checkout@v5
        with:
          repository: jonathan-gtd/scribe
          path: scribe

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scribe-card/package-lock.json

      - name: Install
        working-directory: scribe-card
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build the card the instance will be given
        working-directory: scribe-card
        run: npm run build

      - name: Check it in a real Home Assistant
        working-directory: scribe-card
        # Brings up a throwaway Home Assistant and TimescaleDB, installs Scribe
        # and the built card, onboards over the API, and drives the real
        # frontend. This is what catches what a fake `hass` cannot: the shape
        # Home Assistant rejects a service call with, and `ha-form`.
        run: npm run e2e

      - name: What Home Assistant said, if it failed
        if: failure()
        run: docker logs --tail 100 scribe-card-e2e-ha || true

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: plugin
