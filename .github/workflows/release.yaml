name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # Pushing the tag is the publishing act, so everything must pass on it first.
  ci:
    uses: ./.github/workflows/ci.yaml

  release:
    name: Create release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag is v${TAG} but package.json says ${VERSION}."
            exit 1
          fi

      - run: npm ci && npm run build

      - name: Attest what was built
        # Anyone can then verify the card they downloaded came from this
        # workflow, on this commit: gh attestation verify scribe-card.js --repo …
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/scribe-card.js

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/scribe-card.js
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'b') }}
